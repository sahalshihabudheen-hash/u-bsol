<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-BSOL | Package Details</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .pkg-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 24px; }
    .breadcrumbs { font-size: 14px; color: var(--text-muted); margin-bottom: 40px; display: flex; gap: 8px; align-items: center; }
    .breadcrumbs a { color: var(--text-secondary); text-decoration: none; transition: var(--transition); }
    .breadcrumbs a:hover { color: var(--primary); }
    .breadcrumbs span { color: var(--primary); font-weight: 600; }
    
    .pkg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
    
    .pkg-gallery { display: flex; flex-direction: column; gap: 16px; }
    .pkg-main-img-wrapper { 
      background: var(--bg-card); border-radius: 20px; padding: 40px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; height: 500px;
    }
    .pkg-main-img { width: 100%; max-width: 400px; height: 100%; object-fit: contain; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2)); transition: transform 0.3s ease; }
    
    .pkg-thumbnails { display: flex; gap: 16px; }
    .pkg-thumb { 
      width: 80px; height: 80px; background: var(--bg-card); border: 2px solid transparent; border-radius: 12px;
      padding: 10px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center;
    }
    .pkg-thumb:hover, .pkg-thumb.active { border-color: var(--primary); }
    .pkg-thumb img { width: 100%; height: 100%; object-fit: contain; }
    
    .pkg-info { display: flex; flex-direction: column; gap: 24px; }
    .pkg-title { font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; color: var(--text-primary); text-transform: capitalize; margin-bottom: 16px; }
    .pkg-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 12px; }
    
    .pkg-options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .pkg-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .pkg-select { 
      padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); font-size: 15px; outline: none; max-width: 250px; cursor: pointer;
      appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23999%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
      background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto;
    }
    .pkg-select:focus { border-color: var(--primary); }
    
    .pkg-price-row { display: flex; align-items: baseline; gap: 12px; margin: 32px 0 16px; }
    .pkg-price { font-size: 42px; font-weight: 700; color: var(--primary); }
    .pkg-period { font-size: 16px; color: var(--text-secondary); }
    
    @media (max-width: 991px) {
      .pkg-grid { grid-template-columns: 1fr; gap: 40px; }
      .pkg-main-img-wrapper { height: 350px; }
    }
  </style>
</head>
<body>
  <div id="nav-container"></div>

  <div class="pkg-container">
    <div class="breadcrumbs">
      <a href="index.html">Home</a> &rsaquo; 
      <a href="packages.html">Packages</a> &rsaquo; 
      <span id="bc-plan-name">Loading...</span>
    </div>
    
    <div class="pkg-grid">
      <div class="pkg-gallery">
        <div class="pkg-main-img-wrapper tilt-3d">
          <!-- Main 3D Box image -->
          <img src="https://placehold.co/600x800/1e1e24/ff6600?text=Software+Box" alt="Package Box" id="main-product-img" class="pkg-main-img">
        </div>
        <div class="pkg-thumbnails">
          <div class="pkg-thumb active"><img src="https://placehold.co/600x800/1e1e24/ff6600?text=Software+Box" alt="Thumb 1" id="thumb-img-1"></div>
          <div class="pkg-thumb"><img src="https://placehold.co/600x800/1e1e24/ff6600?text=Features" alt="Thumb 2" id="thumb-img-2"></div>
        </div>
      </div>
      
      <div class="pkg-info">
        <h1 class="pkg-title" id="plan-title">Loading...</h1>
        
        <div id="plan-description">
          <!-- Populated by JS -->
        </div>
        
        <div class="pkg-options">
          <label class="pkg-label">Duration</label>
          <select class="pkg-select" id="duration-select">
            <option value="yearly">Yearly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        
        <div class="pkg-price-row">
          <span class="pkg-price" id="plan-price">₹ 0</span>
          <span class="pkg-period" id="plan-period">/ year</span>
        </div>
        
        <a href="https://wa.me/+918330011641" target="_blank" class="btn-primary" style="max-width: 250px; text-align: center; padding: 16px 32px; font-size: 18px; border-radius: 50px;">Buy Now</a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="components.js"></script>
  <script>
    injectComponents('packages');
    
    const planData = {
      essential: {
        title: "Essential",
        monthly: "1,500",
        yearly: "14,400",
        desc: `
          <p class="pkg-desc">This package is perfect for businesses just starting out online. Get a fully responsive website under your own brand name and start establishing a solid digital footprint.</p>
          <p class="pkg-desc">Includes everything you need to display your basic catalog and allow customers to browse efficiently. Start small, but look professional with automated SEO elements built right in.</p>
        `,
        image1: "https://placehold.co/600x800/1e1e24/ff6600?text=ESSENTIAL\nPackage",
        image2: "https://placehold.co/600x800/1e1e24/ff6600?text=App+Preview"
      },
      basic: {
        title: "Basic",
        monthly: "2,500",
        yearly: "25,000",
        desc: `
          <p class="pkg-desc">This package is very suitable for individual person's business, especially who is doing the business through social media such as Facebook, Instagram etc... This will be great advantage for them to showcase their product under their own brand name and share the content with public through any media. Also it will make better online presence by automated SEO. This package contain responsive website and WhatsApp checkout.</p>
          <p class="pkg-desc">This package will enables you to receive your customer orders into your WhatsApp number and it will be listed in your dashboard as pending order. The order status will be change based on next action you make apply on the same order such as (Order Process, Generate Invoice, Products Delivery, etc..)</p>
        `,
        image1: "https://placehold.co/600x800/1e1e24/ff6600?text=BASIC\nBusiness+Package",
        image2: "https://placehold.co/600x800/1e1e24/ff6600?text=App+Preview"
      },
      starter: {
        title: "Starter",
        monthly: "3,500",
        yearly: "33,600",
        desc: `
          <p class="pkg-desc">Ideal for growing businesses that require a dedicated Order Notification App (Android) for their internal staff to manage operations quickly on the go.</p>
          <p class="pkg-desc">Along with increased storage and multiple store pickup locations, this plan opens up wider capabilities for local retailers expanding their footprints and scaling operations rapidly.</p>
        `,
        image1: "https://placehold.co/600x800/1e1e24/ff6600?text=STARTER\nBusiness+Package",
        image2: "https://placehold.co/600x800/1e1e24/ff6600?text=App+Preview"
      },
      premier: {
        title: "Premier",
        monthly: "5,000",
        yearly: "48,000",
        desc: `
          <p class="pkg-desc">The ultimate enterprise solution. Engage directly with your customer base through dedicated Customer Mobile Apps (Android & iOS) with your custom branding.</p>
          <p class="pkg-desc">With massive storage, up to 5 store locations, and priority support, this package is designed for established businesses looking for zero compromises. Bring the total digital ecosystem to your fingertips.</p>
        `,
        image1: "https://placehold.co/600x800/1e1e24/ff6600?text=PREMIER\nBusiness+Package",
        image2: "https://placehold.co/600x800/1e1e24/ff6600?text=App+Preview"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const planId = urlParams.get('plan') || 'basic';
    const plan = planData[planId] || planData['basic'];

    document.getElementById('bc-plan-name').textContent = plan.title;
    document.getElementById('plan-title').textContent = plan.title;
    document.getElementById('plan-description').innerHTML = plan.desc;
    document.getElementById('main-product-img').src = plan.image1;
    document.getElementById('thumb-img-1').src = plan.image1;
    document.getElementById('thumb-img-2').src = plan.image2;
    document.title = "U-BSOL | " + plan.title + " Package";

    // Handle duration selection
    const durationSelect = document.getElementById('duration-select');
    const priceEl = document.getElementById('plan-price');
    const periodEl = document.getElementById('plan-period');

    function updatePrice() {
      if (durationSelect.value === 'yearly') {
        priceEl.textContent = '₹ ' + plan.yearly;
        periodEl.textContent = '/ year';
      } else {
        priceEl.textContent = '₹ ' + plan.monthly;
        periodEl.textContent = '/ month';
      }
    }

    durationSelect.addEventListener('change', updatePrice);
    updatePrice(); // Initial set
    
    // Setup simple gallery functionality
    const thumbs = document.querySelectorAll('.pkg-thumb');
    const mainImg = document.getElementById('main-product-img');
    
    thumbs.forEach(thumb => {
      thumb.addEventListener('click', function() {
        thumbs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        mainImg.src = this.querySelector('img').src;
      });
    });
  </script>
</body>
</html>
